# ==========================================================================
# 《藏经坞》Nginx 站点配置（新站）
#
# 只需要一件事：把 80 / 443 反代到 Node 进程。前端静态产物由该进程同源托管，
# 所以这里不需要任何 root / alias / try_files —— SPA 兜底在 Express 里做。
#
# 相对旧站删掉的部分（都随子系统一起删了，留着会误导后来人）：
#   - api.@DOMAIN@ 那个内部接口入口整块（/api/internal/，X-Internal-Key 鉴权）
#   - /api/worker/ 的分析机 IP 白名单（分析任务模块已移除）
#   - 配套的 limit_req_zone 说明（唯一的内部接口没了，限流区也就不需要）
#
# 安装：
#   sudo sed 's|@DOMAIN@|your.domain.com|g' deploy/nginx/cangjingwu.conf \
#     | sudo tee /etc/nginx/sites-available/cangjingwu.conf > /dev/null
#   sudo ln -sf /etc/nginx/sites-available/cangjingwu.conf /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
# ==========================================================================

server {
    listen 80;
    listen [::]:80;
    server_name @DOMAIN@;

    # 必须 ≥ .env 的 UPLOAD_MAX_BYTES（512MB），
    # 否则大文件会先被 Nginx 以 413 拒掉，前端只会看到「上传失败」。
    client_max_body_size 512M;
    client_body_timeout 600s;
    send_timeout 600s;
    keepalive_timeout 75s;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/markdown application/json
               application/javascript application/xml image/svg+xml;

    access_log /var/log/nginx/cangjingwu.access.log;
    error_log  /var/log/nginx/cangjingwu.error.log warn;

    # 只允许常见方法，少一点是一点
    if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) {
        return 405;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "";

        # 大文件上传与媒体流：关掉请求缓冲与响应缓冲，避免落盘中转与卡顿
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 开场页与 /assets 都带内容哈希或协商缓存，交给应用层设 Cache-Control，
    # 这里不要重复加 expires，否则会盖掉应用层的 no-cache。
}

# ==========================================================================
# HTTPS（推荐 certbot 自动签发与续期）：
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d your.domain.com
# 完成后 Nginx 会自动加上 443 段与证书续期定时任务。
#
# 腾讯云安全组：入站只放行 22（限制来源 IP）、80、443。
#   —— 应用的 8080 不要对外放行，只监听回环或由安全组挡住。
# 中国大陆地域的域名需完成 ICP 备案，否则 80/443 会被拦截。
# ==========================================================================
